"$id": "https://schema.jupytergis.org/events/layer/v1"
version: "1"
title: "JupyterGIS layer event"
description: "A JupyterGIS layer was created, deleted, or updated in the GUI."
type: "object"
definitions:
  sourceReference:
    title: "Source reference"
    description: "Where a source's data comes from. Never holds credentials, query parameters outside a safe list, or inline data."
    type: "object"
    required:
      - "id"
      - "type"
    additionalProperties: false
    properties:
      id:
        description: "The source's ID."
        type: "string"
      type:
        description: "The source's type, such as `GeoJSONSource`."
        type: "string"
      path:
        description: "The path as written in the source. `null` when the path is a URL."
        type: ["string", "null"]
      resolved_path:
        description: "The Contents path that JupyterGIS loads, relative to the server root. `null` for URLs."
        type: ["string", "null"]
      tables:
        description: "A GeoPackage source's tables."
        type: "array"
        items:
          type: "string"
      urls:
        description: "Each URL of the source, without user information, fragment or unsafe query parameters."
        type: "array"
        items:
          type: "string"
      inline:
        description: "For embedded data, the field that holds it and its serialized size in bytes."
        type: "object"
        required:
          - "field"
          - "size"
        additionalProperties: false
        properties:
          field:
            type: "string"
          size:
            type: "integer"
            minimum: 0
required:
  - "verb"
  - "object"
properties:
  subject:
    title: "Subject"
    description: "The performer of `verb`. Client ID of acting user, if available."
    type: "string"
  # trail: origin - lets consumers tell the copy that made a change from replicas.
  local:
    title: "Local"
    description: "True when the change originated in the document copy that reported it."
    type: "boolean"
  verb:
    title: "Verb"
    description: "Layer action"
    enum:
      - "added"
      - "updated"
      - "removed"
  object:
    title: "Object"
    description: "The thing that `verb` was performed on."
    type: "object"
    required:
      - "document_path"
      - "layer_id"
    properties:
      document_path:
        title: "Document path"
        description: "The path of the `.jGIS` document, or `null` if ephemeral."
        type: ["string", "null"]
      layer_id:
        title: "Layer ID"
        description: "Unique ID of the layer."
        type: "string"
      old:
        title: "Old value"
        description: "The layer object as it was before `verb`. Absent for 'added' `verb`."
        type: "object"
        # TODO: The actual shape of a layer object! How to "import" that knowledge from packages/schemas?
        # properties:
      new:
        title: "New value"
        description: "The layer object as it is after `verb`. Absent for 'deleted' `verb`."
        type: "object"
        # TODO: The actual shape of a layer object! How to "import" that knowledge from packages/schemas?
        # properties:
      # trail: resources - the layer's data reference, kept for removals of orphaned sources.
      source:
        description: "The reference of the layer's source. Present on added and removed, and on updated when the layer switched sources."
        $ref: "#/definitions/sourceReference"
